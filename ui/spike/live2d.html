<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Eva Live2D test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #hud { position: absolute; left: 10px; top: 8px; font: 16px monospace; color: #8fe9ff; }
</style>
</head>
<body>
<canvas id="c"></canvas><div id="hud"></div>
<script src="live2d/lib/live2dcubismcore.min.js"></script>
<script src="live2d/lib/pixi.min.js"></script>
<script src="live2d/lib/cubism4.min.js"></script>
<script>
"use strict";
// A test of Live2D on the Station (Mali-400, WebGL1): the official sample model
// (Hiyori, Live2D Free Material License) with its own idle motions, blinks,
// breath and physics; the lips from the same "speak" events as the TV face
// (eva_say viseme track: [viseme, opening] every hop ms). ?demo moves the lips
// without speech. FPS goes to the console (the cog journal), as in ascii.html.
const P = new URLSearchParams(location.search);
const log = (...a) => console.log("[live2d]", ...a);
const app = new PIXI.Application({ view: document.getElementById("c"), resizeTo: window,
  backgroundColor: 0x000000, antialias: false, resolution: 1 });
let track = null, model = null;

(async () => {
  model = await PIXI.live2d.Live2DModel.from("live2d/hiyori/Hiyori.model3.json", { autoInteract: false });
  app.stage.addChild(model);
  fit();
  addEventListener("resize", fit);
  // the lips: after the motions, so speech wins over the idle motion's mouth
  model.internalModel.on("beforeModelUpdate", () => {
    const m = mouth();
    if (m === null) return;
    const core = model.internalModel.coreModel;
    core.setParameterValueById("ParamMouthOpenY", m.open);
    core.setParameterValueById("ParamMouthForm", m.form);
  });
  log("model", model.internalModel.originalWidth + "x" + model.internalModel.originalHeight);
})().catch((e) => log("error", e && e.message || e));

function fit() {
  // close-up: head and shoulders fill the screen (the model is full length)
  const W = innerWidth, H = innerHeight, k = +(P.get("zoom") || 2.3);
  const s = (H * k) / model.internalModel.originalHeight;
  model.scale.set(s);
  model.anchor.set(0.5, 0);
  model.x = W / 2;
  model.y = -H * +(P.get("top") || 0.08);
}

const FORM = { ee: 0.8, ih: 0.6, aa: 0.1, oh: -0.5, ou: -0.9, rest: 0 };
function mouth() {
  if (P.has("demo")) {
    const t = performance.now() / 1000;
    return { open: Math.max(0, Math.sin(t * 9) * 0.5 + Math.sin(t * 3.7) * 0.4), form: Math.sin(t * 1.3) * 0.6 };
  }
  if (!track) return null;
  const pos = (Date.now() - track.start) / track.hop, i = Math.floor(pos);
  if (i >= track.frames.length) { track = null; return { open: 0, form: 0 }; }
  if (i < 0) return null;
  const [v, o] = track.frames[i];
  const o2 = i + 1 < track.frames.length ? track.frames[i + 1][1] : 0;
  return { open: Math.min(1, (o + (o2 - o) * (pos - i)) * 1.1), form: FORM[v] ?? 0 };
}

// speech events from ui_server (the same stream the TV face listens to)
try {
  const es = new EventSource("/events");
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "speak") track = ev;
    else if (ev.type === "stop") track = null;
  };
} catch (e) { log("no events", e); }

let frames = 0, last = performance.now(), worst = 0, prev = last;
app.ticker.add(() => {
  const now = performance.now();
  worst = Math.max(worst, now - prev); prev = now; frames++;
  if (now - last >= 2000) {
    const fps = frames * 1000 / (now - last);
    log("fps", fps.toFixed(1), "worst_ms", worst.toFixed(0));
    if (P.has("hud")) document.getElementById("hud").textContent = fps.toFixed(0) + " fps";
    frames = 0; last = now; worst = 0;
  }
});
</script>
</body>
</html>
